name: Service estimate checks
on:
  push:
    branches: [main, feature/shippo-invoice-links-20260929]
    paths:
      - 'components/public/EstimateForm.tsx'
      - 'components/public/EstimatesAdminTab.tsx'
      - 'lib/service-estimate.mjs'
      - 'types.ts'
      - 'tests/access/service-estimate.test.mjs'
      - '.github/workflows/service-estimate-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'components/public/EstimateForm.tsx'
      - 'components/public/EstimatesAdminTab.tsx'
      - 'lib/service-estimate.mjs'
      - 'types.ts'
      - 'tests/access/service-estimate.test.mjs'
      - '.github/workflows/service-estimate-checks.yml'
permissions:
  contents: read
jobs:
  estimate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/access/service-estimate.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
