name: Staff access checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  access-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test tools
        working-directory: tests/access
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test safe authentication diagnostics
        run: node --test tests/access/firebase-failure.test.mjs
      - name: Check syntax of changed TypeScript and TSX
        working-directory: tests/access
        run: node syntax-check.mjs
      - name: Test Firestore access with a demo project
        working-directory: tests/access
        run: npm test
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test payment and listing safeguards
        run: node --test tests/access/stripe-test.test.mjs tests/access/listing-stats.test.mjs tests/access/rug-checkout.test.mjs tests/upgrade/integrations.test.mjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  browser-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: emulator-only-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-marcopolo-access
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-marcopolo-access.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-marcopolo-access.appspot.com
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:123:web:emulator'
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'true'
      FIREBASE_PROJECT_ID: demo-marcopolo-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tests/access
      - run: npx playwright install --with-deps chromium
        working-directory: tests/access
      - name: Browser checks with demo Firebase only
        working-directory: tests/access
        run: |
          node -e "require('node:fs').copyFileSync('../../firestore.rules','firestore.rules')"
          npx firebase emulators:exec --project demo-marcopolo-access --only auth,firestore --config firebase.json "npm --prefix ../.. run build && node browser-runner.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-screenshots
          path: tests/access/screenshots
