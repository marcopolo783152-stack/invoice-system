name: Staff access checks
on:
  push:
    branches: [fix/notification-foundation-20260914]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  access-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test tools
        working-directory: tests/access
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check syntax of changed TypeScript and TSX
        working-directory: tests/access
        run: node syntax-check.mjs
      - name: Test Firestore access with a demo project
        working-directory: tests/access
        run: npm test
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/scripts/refresh-lock.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
